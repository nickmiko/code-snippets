league_settings:
  league_id: "y1vhm0kqmlv8n2tu" # Replace with your Fantrax league ID
  my_team_name: "Despicable Miko" # Replace with your team name
  user_secret_id: "YOUR_USER_SECRET_ID" # Replace with your Fantrax User Secret ID
  teams: 12
  budget: 260
  show_ranks: true
  hitter_split: 0.5
  pitcher_split: 0.5
  stars_and_scrubs_multiplier: 1.05 # > 1.0 increases top player values, 1.0 is standard, < 1.0 flattens values

roster:
  C: 1
  1B: 1
  2B: 1
  3B: 1
  SS: 1
  MI: 0
  CI: 0
  OF: 3
  UT: 2
  SP: 5
  RP: 2
  P: 3
  Bench: 5  # Universal bench spots (can be filled by either H or P)

categories:
  hitters: [R, HR, RBI, SB, OBP]
  pitchers: [QS+W, SV+HLD, K, ERA, WHIP]

category_weights:
  defaults: 1.0 # Everything is 1.0 by default unless specified below
  SB: 0.75

projections_weights:
  atc: 0.80
  pitcherlist: 0.20
