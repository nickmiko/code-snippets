[project]
name = "baseball-auction-values"
version = "0.1.0"
description = "Fantasy baseball projection evaluation and auction value calculator"
requires-python = ">=3.10"

dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "streamlit>=1.30",
  "pyarrow>=14.0",
]

[tool.uv]
# Default to running commands from this directory

[tool.uv.scripts]
# Recompute auction values from projections
create-values = "python create_auction_values.py"
# Run the Streamlit UI
app = "streamlit run baseball_values.py"